<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON Viewer — Human-Readable</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  /* AI: aligned with app/globals.css (:root dark palette) */
  --bg: #25262b;
  --surface: #2d2e33;
  --surface-2: #35363c;
  --border: #3f4048;
  --text: #f2f2f4;
  --muted: #9a9aa6;
  --accent: #6ee7a8;
  --accent-fg: #1a1b1e;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.28), 0 1px 2px rgba(0,0,0,.18);

  --th-bg: #2a3140;
  --th-border: #3d4656;
  --td-stripe: rgba(255,255,255,.025);
  --td-hover: rgba(110,231,168,.07);

  --jbg: #1e1f23;
  --jkey: #9cdcfe;
  --jstr: #ce9178;
  --jnum: #b5cea8;
  --jbool: #569cd6;
  --jnull: #7a7f8a;
  --jdate: #4ec9b0;
  --jpunct: #808890;
  --jell: #6a9955;
  --jfa: #666;
}

body[data-chrome="light"] {
  --bg: #ffffff;
  --surface: #f8fafc;
  --surface-2: #f1f5f9;
  --border: #e2e8f0;
  --text: #0f172a;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-fg: #ffffff;
  --th-bg: #f1f5f9;
  --th-border: #e2e8f0;
  --td-stripe: rgba(15, 23, 42, 0.03);
  --td-hover: rgba(37, 99, 235, 0.08);
  --jbg: #f8fafc;
  --jkey: #0369a1;
  --jstr: #047857;
  --jnum: #b45309;
  --jbool: #1d4ed8;
  --jnull: #64748b;
  --jdate: #0f766e;
  --jpunct: #64748b;
  --jell: #64748b;
  --jfa: #94a3b8;
}

/* AI: app theme — matches components/highlight.tsx (pipeline / log JSON output) */
body[data-syntax-theme="app"] {
  --jkey: oklch(0.65 0.16 230);
  --jstr: oklch(0.72 0.15 162);
  --jnum: oklch(0.74 0.16 60);
  --jbool: oklch(0.62 0.21 25);
  --jnull: oklch(0.62 0.21 25);
  --jdate: oklch(0.65 0.16 230);
  --jpunct: oklch(0.65 0.005 264);
  --jell: oklch(0.65 0.005 264);
}

/* AI : light chrome wins over the dark-first app syntax tokens */
body[data-chrome="light"][data-syntax-theme="app"] {
  --jkey: #0369a1;
  --jstr: #047857;
  --jnum: #b45309;
  --jbool: #1d4ed8;
  --jnull: #64748b;
  --jdate: #0f766e;
  --jpunct: #64748b;
  --jell: #64748b;
}

html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

/* ── Header ───────────────────────────────────────────── */
header {
  background: var(--surface);
  display: flex; align-items: center; gap: 0;
  padding: 0 14px; height: 46px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.h-logo span { color: var(--text); font-size:14px; font-weight:600; letter-spacing:-.2px; }
.ex-tab {
  padding:5px 13px; font-size:12.5px; color:var(--muted); background:transparent;
  border:none; border-radius:6px; cursor:pointer; transition:all .15s; font-family:inherit; white-space:nowrap;
}
.ex-tab:hover  { background:var(--surface-2); color:var(--text); }
.ex-tab.active { background:var(--accent); color:var(--accent-fg); }
.h-logo { display:flex; align-items:center; gap:8px; margin-right:16px; }
.ex-tabs { display:flex; gap:2px; flex:1; }
body[data-snapshot] .ex-tabs { overflow-x:auto; min-width:0; }
.h-badge { font-size:10.5px; font-weight:600; padding:3px 10px; border-radius:999px; margin-left:8px; flex-shrink:0; }
.hb-schema { background:#4c1d95; color:#c4b5fd; }
.hb-data   { background:#14532d; color:#86efac; }

/* ── Main (single column — structure/json open on demand) ─ */
main { display:grid; grid-template-columns:1fr; overflow:hidden; }

/* ── Code panel popup (structure / JSON) ─────────────── */
#code-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:140;
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#code-overlay.open { opacity:1; pointer-events:auto; }
#json-panel {
  position:fixed; left:50%; top:50%;
  width:90vw; height:90vh; max-width:90vw; max-height:90vh;
  background:var(--jbg); display:flex; flex-direction:column;
  border:1px solid var(--border); border-radius:12px; z-index:150;
  transform:translate(-50%,-50%) scale(.96);
  opacity:0; pointer-events:none;
  transition:transform .22s ease, opacity .22s ease;
  box-shadow:0 24px 80px rgba(0,0,0,.55);
}
#json-panel.open {
  transform:translate(-50%,-50%) scale(1);
  opacity:1; pointer-events:auto;
}
.jp-header {
  display:flex; align-items:center; gap:8px;
  padding:7px 14px; font-size:10px; font-weight:700; text-transform:uppercase;
  letter-spacing:.08em; color:var(--muted); border-bottom:1px solid var(--border);
  background:var(--surface); z-index:1; flex-shrink:0;
  border-radius:12px 12px 0 0;
}
#json-zoom-scroll {
  flex:1; min-height:0; overflow:auto; position:relative;
  touch-action:pan-x pan-y;
}
#json-zoom-viewport {
  transform-origin:0 0;
  will-change:transform;
  min-width:100%;
  box-sizing:border-box;
}
.jp-zoom-bar {
  display:flex; align-items:center; gap:6px; margin-left:auto; flex-shrink:0;
}
.jp-zoom-btn {
  width:22px; height:22px; border-radius:5px; border:1px solid #333;
  background:transparent; cursor:pointer; font-size:13px; color:#888;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.jp-zoom-btn:hover { background:#252525; color:#ccc; border-color:#555; }
.jp-zoom-label {
  font-size:10px; font-weight:600; color:var(--muted); min-width:38px; text-align:center;
  font-variant-numeric:tabular-nums;
}
#json-code {
  padding:10px 0 20px 0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13px; line-height:1.6;
}
#json-code.json-mode {
  width:max-content;
  min-width:100%;
  box-sizing:border-box;
  font-family:"SF Mono","Fira Code","Cascadia Code",Consolas,monospace;
  font-size:12.5px; line-height:1.65;
}

/* Structure tree rows */
.st-row {
  display:flex; align-items:center; gap:8px;
  padding:4px 14px 4px calc(16px + var(--d,0)*18px);
  min-height:27px; position:relative;
}
.st-row:hover { background:rgba(255,255,255,.04); }
.st-parent { cursor:pointer; }
.st-toggle { font-size:9px; color:#4a4a4a; width:12px; text-align:center; flex-shrink:0; user-select:none; transition:color .12s; }
.st-spacer { width:12px; flex-shrink:0; }
.st-parent:hover .st-toggle { color:#888; }
.st-label  { font-size:13px; color:#d0d0d0; font-weight:500; flex:1; min-width:0; word-break:break-word; }
.st-type   { font-size:10px; font-weight:600; white-space:nowrap; flex-shrink:0; }

/* Guide lines */
.st-kids {
  border-left:1px solid rgba(255,255,255,.07);
  margin-left:calc(16px + var(--d,0)*18px + 5px);
}
.st-kids.st-closed { display:none; }

/* Schema-mode extras */
.st-req   { font-size:9px; padding:1px 5px; border-radius:999px; background:#2d0b0b; color:#f87171; margin-left:4px; flex-shrink:0; }
.st-opt   { font-size:9px; padding:1px 5px; border-radius:999px; background:#1f2937; color:#6b7280; margin-left:4px; flex-shrink:0; }
.st-desc  { font-size:11px; color:#4b5563; margin-left:4px; font-style:italic; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:160px; }

/* ── Left panel mode toggle (Structure / JSON) ─────── */
.jp-htitle { flex:1; }
.jp-close {
  width:22px; height:22px; border-radius:5px; border:1px solid #333;
  background:transparent; cursor:pointer; font-size:12px; color:#666;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.jp-close:hover { background:#252525; color:#aaa; border-color:#555; }
.jp-toggle { display:flex; gap:2px; }
.jp-tbtn {
  font-size:9px; padding:2px 7px; border-radius:4px;
  border:1px solid #333; background:transparent; color:#4a4a4a;
  cursor:pointer; font-family:inherit; text-transform:uppercase;
  font-weight:700; letter-spacing:.06em; transition:all .12s;
}
.jp-tbtn:hover { color:#888; border-color:#555; }
.jp-tbtn.active { background:#1f2937; border-color:#374151; color:#9ca3af; }

/* ── JSON mode line styles ─ */
.j-line { display:flex; align-items:flex-start; min-height:20px; position:relative; width:max-content; min-width:100%; }
.j-gutter, .j-content { position:relative; z-index:1; }
.j-line:hover:not(.j-highlight)::before {
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:rgba(255,255,255,.025);
}
.j-gutter {
  width:92px; flex-shrink:0; display:flex; align-items:center;
  justify-content:flex-end; padding-right:8px; padding-top:1px; gap:3px; user-select:none;
}
.j-tag { display:flex; align-items:center; gap:3px; cursor:pointer; padding:1px 4px; border-radius:3px; transition:background .1s; }
.j-tag:hover { background:rgba(255,255,255,.07); }
.j-fa    { font-size:9px; color:var(--jfa); transition:color .1s; line-height:1; }
.j-fname { font-size:9px; color:rgba(200,200,200,.3); font-style:italic; max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.j-tag:hover .j-fa, .j-tag:hover .j-fname { color:rgba(220,220,220,.7); }
.j-content { flex:0 0 auto; padding-left:calc(var(--d,0)*16px); padding-right:18px; white-space:pre; word-break:break-all; }
.j-body   { border-left:2px solid transparent; margin-left:1px; }
.j-key    { color:var(--jkey); }
.j-str    { color:var(--jstr); }
.j-num    { color:var(--jnum); }
.j-bool   { color:var(--jbool); }
.j-null   { color:var(--jnull); font-style:italic; }
.j-date   { color:var(--jdate); }
.j-p      { color:var(--jpunct); }
.j-ell    { color:var(--jell); font-style:italic; letter-spacing:.05em; }

/* Highlight animation when jumping from human view → JSON / structure */
@keyframes jhl { 0%{background:rgba(234,179,8,.35)} 100%{background:transparent} }
.j-line.j-highlight::after {
  content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
  border-radius:2px; animation:jhl 2s forwards;
}
.st-highlight { animation:jhl 2s forwards; border-radius:2px; }

/* ── Right Panel ──────────────────────────────────────── */
#rendered-panel { overflow:hidden; display:flex; flex-direction:column; background:var(--bg); }

.rp-header {
  padding:4px 8px; background:var(--bg);
  border-bottom:1px solid var(--border); display:flex; align-items:center;
  justify-content:flex-end; gap:6px; flex-shrink:0; overflow:visible;
}

/* View toggle */
.view-toggle { display:flex; gap:2px; flex-shrink:0; align-items:center; }
.vbtn {
  padding:2px 8px; font-size:10px; font-weight:500; border-radius:4px;
  border:1px solid var(--border); background:var(--surface); cursor:pointer;
  color:var(--muted); font-family:inherit; transition:all .12s; line-height:1.3;
  flex-shrink:0;
}
.vbtn:hover  { border-color:var(--accent); color:var(--accent); }
.vbtn.active { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
/* AI : fullscreen sits right of JSON — keep visible in cramped embeds */
.vbtn-fs {
  display:none; width:22px; height:20px; padding:0;
  align-items:center; justify-content:center; font-size:11px; line-height:1;
}
body[data-fs="1"] .vbtn-fs { display:inline-flex; }
body[data-fs="1"] .dp-fs { display:inline-flex; }

/* AI : shareable snapshot — Download sits beside tree/table/json, hidden in embed/demo */
.dl-wrap { display:none; position:relative; flex-shrink:0; }
body[data-snapshot] .dl-wrap { display:block; }
.dl-menu {
  position:absolute; top:calc(100% + 4px); right:0; z-index:20;
  min-width:148px; padding:4px;
  background:var(--surface); border:1px solid var(--border); border-radius:6px;
  box-shadow:var(--shadow);
}
.dl-item {
  display:block; width:100%; text-align:left;
  padding:6px 8px; font-size:11px; color:var(--text);
  background:transparent; border:none; border-radius:4px;
  cursor:pointer; font-family:inherit;
}
.dl-item:hover { background:var(--surface-2); color:var(--accent); }

#rp-content { flex:1; overflow:auto; padding:4px 6px; display:flex; flex-direction:column; background:var(--bg); }

/* AI : inline JSON tab — compact foldable syntax in the main panel */
.inline-json-root {
  font-family:"SF Mono","Fira Code","Cascadia Code",Consolas,monospace;
  font-size:11px; line-height:1.5; padding:2px 0 8px;
}
.inline-json-root .j-line { min-height:17px; }
.inline-json-root .j-gutter { width:72px; }
.inline-json-root .j-fname { max-width:44px; }
body[data-embed] .inline-json-root { font-size:10.5px; line-height:1.45; }
body[data-embed] .rp-header { min-height:28px; }

/* AI : excel-only embeds — hide tree/json, JSON jumps, structure panel */
body[data-locked-view="table"] #vb-tree,
body[data-locked-view="table"] #vb-json,
body[data-locked-view="table"] .td-jumps,
body[data-locked-view="table"] .th-struct-link { display: none; }
body[data-locked-view="table"] #json-panel { display: none !important; }
body[data-locked-view="table"]:not([data-fs="1"]) .rp-header { display: none; }

/* ── Cards view (legacy) ──────────────────────────────── */
.root-meta  { margin-bottom:14px; }
.root-title { font-size:19px; font-weight:700; letter-spacing:-.3px; }
.root-desc  { font-size:13px; color:var(--muted); margin-top:3px; }
.node-group { display:flex; flex-direction:column; gap:6px; }
.node-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow);
}
.node-card:hover > .node-head { background:var(--surface-2); }
.node-head { padding:9px 12px 9px 10px; display:flex; align-items:flex-start; gap:8px; user-select:none; transition:background .1s; }
.node-head.clickable { cursor:pointer; }
.node-head.static    { cursor:default; }
.n-chev { font-size:10px; color:var(--muted); line-height:22px; flex-shrink:0; width:14px; text-align:center; font-family:monospace; transition:color .15s; }
.n-chev.open { color:var(--accent); }
.n-chev.leaf { opacity:0; pointer-events:none; }
.n-labels { flex:1; min-width:0; }
.n-label  { font-size:13.5px; font-weight:600; line-height:1.3; }
.n-desc   { font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.4; }
.n-badges { display:flex; gap:4px; flex-wrap:wrap; flex-shrink:0; align-items:flex-start; padding-top:1px; }
.badge { font-size:10.5px; font-weight:500; padding:2px 7px; border-radius:999px; white-space:nowrap; line-height:1.5; }
.bt-text   { background:#f0fdf4; color:#15803d; }
.bt-number { background:#eff6ff; color:#1d4ed8; }
.bt-bool   { background:#fdf4ff; color:#9333ea; }
.bt-list   { background:#fff7ed; color:#c2410c; }
.bt-group  { background:#f8fafc; color:#475569; border:1px solid #e2e8f0; }
.bt-date   { background:#f0f9ff; color:#0369a1; }
.bt-null   { background:#f9fafb; color:#9ca3af; border:1px solid #e5e7eb; }
.bt-choice { background:#fefce8; color:#a16207; }
.bt-mixed  { background:#fdf2f8; color:#be185d; }
.bt-req    { background:#fff1f2; color:#be123c; }
.bt-opt    { background:#f9fafb; color:#9ca3af; border:1px solid #e5e7eb; }
.n-value { padding:0 12px 9px calc(10px + 14px + 8px); font-size:12.5px; font-family:"SF Mono","Fira Code",monospace; word-break:break-all; }
.v-str  { color:#15803d; }
.v-num  { color:#2563eb; }
.v-bool { color:#7c3aed; font-style:italic; }
.v-null { color:#9ca3af; font-style:italic; }
.v-date { color:#0369a1; }
.n-constraints, .n-enum { display:flex; flex-wrap:wrap; gap:4px; padding:0 12px 9px calc(10px + 14px + 8px); }
.constraint { font-size:10.5px; padding:2px 8px; border-radius:6px; background:#fffbeb; color:#b45309; border:1px solid #fde68a; }
.enum-chip  { font-size:10.5px; padding:2px 8px; border-radius:6px; background:#fefce8; color:#92400e; border:1px solid #fde68a; font-family:"SF Mono","Fira Code",monospace; }
.n-children { border-top:1px solid var(--border); padding:8px; display:flex; flex-direction:column; gap:5px; background:var(--bg); }
.n-children.closed { display:none; }
.arr-idx { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:2px 0 3px calc(10px + 14px + 8px); }

/* ── Excel / Table view ───────────────────────────────── */
.excel-nav {
  display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-shrink:0;
}
.ex-back {
  padding:2px 8px; font-size:11px; font-weight:500; border-radius:4px;
  border:1px solid var(--border); background:var(--surface); cursor:pointer;
  color:var(--text); font-family:inherit; transition:all .12s;
}
.ex-back:hover { border-color:var(--accent); color:var(--accent); }
.ex-bc { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:3px; }
.ebc-link   { color:var(--accent); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }
.ebc-active { color:var(--text); font-weight:600; }
.ebc-sep    { color:var(--border); }
.ex-count   { margin-left:auto; font-size:11px; color:var(--muted); white-space:nowrap; }

.excel-wrap {
  overflow:auto; flex:1; border:1px solid var(--border);
  border-radius:var(--radius); background:var(--surface);
}
.excel-table {
  border-collapse:collapse; min-width:100%;
  font-size:11.5px; white-space:nowrap;
}
.excel-table thead { position:sticky; top:0; z-index:2; }
.th-inner { padding:3px 6px; display:flex; flex-direction:column; gap:0; }
.excel-table th {
  background:var(--th-bg); color:var(--text);
  padding:0; text-align:left; font-weight:500; font-size:10px;
  border-right:1px solid var(--th-border); cursor:default; user-select:none; min-width:64px;
}
.th-group { font-size:9px; color:var(--muted); font-weight:400; text-transform:uppercase; letter-spacing:.06em; }
.th-name  { font-size:10.5px; color:var(--text); font-weight:600; }
.th-path  { font-family:"SF Mono","Fira Code",monospace; font-size:10px; font-weight:500; }
.th-type  { font-size:9px; color:var(--muted); font-weight:400; font-family:"SF Mono","Fira Code",monospace; }
.th-struct-link {
  display:block; font-size:9px; color:var(--accent); cursor:pointer;
  margin-top:2px; line-height:1.2; font-weight:500; opacity:.85;
}
.th-struct-link:hover { opacity:1; text-decoration:underline; text-underline-offset:2px; }
.excel-table th.th-num { background:var(--surface-2); min-width:28px; width:28px; }
.excel-table td.td-num-idx {
  text-align:center; color:var(--muted); font-size:10px;
  background:var(--surface-2) !important; border-right:1px solid var(--border);
}
.excel-table tr:hover td.td-num-idx { background:var(--surface-2) !important; }
.excel-table th:hover { background:var(--surface-2); }
.excel-table th.sorted { background:var(--surface-2); }
.sort-arrow { margin-left:4px; font-size:9px; color:var(--muted); }

.excel-table td {
  padding:3px 6px; border-bottom:1px solid var(--border); border-right:1px solid var(--border);
  vertical-align:middle; color:var(--text);
}
.excel-table tr:nth-child(even) td { background:var(--td-stripe); }
.excel-table tr:hover td { background:var(--td-hover) !important; }
.td-num   { text-align:right; color:#93c5fd; font-family:"SF Mono","Fira Code",monospace; font-size:11px; }
.td-null  { color:var(--muted); font-style:italic; }
.td-bool-y { color:var(--accent); font-weight:600; }
.td-bool-n { color:var(--muted); }
.td-date   { color:#67e8f9; font-size:11.5px; }
.td-long   { max-width:200px; overflow:hidden; text-overflow:ellipsis; }

/* Cell jump links (JSON / structure) */
.td-inner { display:flex; align-items:center; gap:6px; min-width:0; }
.td-val   { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.td-jumps { display:flex; gap:2px; flex-shrink:0; opacity:0; transition:opacity .1s; }
.excel-table tr:hover .td-jumps { opacity:1; }
.cell-jump {
  font-size:9px; color:var(--muted); cursor:pointer; padding:1px 5px; border-radius:4px;

<script>
// AI: lightweight structured logger — prefix all events for easy DevTools filtering
const log = (event, detail={}) => console.log('[JSON Viewer]', event, detail);

// AI : shareable HTML export injects a snapshot object between these tokens — keep in sync with shared/json-viewer/snapshot.ts JSON_VIEWER_SNAPSHOT_TOKEN
const _SNAPSHOT = /*JSON_VIEWER_SNAPSHOT_JSON*/null/*JSON_VIEWER_SNAPSHOT_JSON*/;

// ── Color palette for fold blocks ─────────────────────────────────────────────
const PALETTE = [
  { bg:'rgba(56,132,255,0.09)',  bl:'rgba(56,132,255,0.45)'  },
  { bg:'rgba(168,85,247,0.09)', bl:'rgba(168,85,247,0.45)'  },
  { bg:'rgba(16,185,129,0.09)', bl:'rgba(16,185,129,0.45)'  },
  { bg:'rgba(245,158,11,0.09)', bl:'rgba(245,158,11,0.45)'  },
  { bg:'rgba(239,68,68,0.09)',  bl:'rgba(239,68,68,0.45)'   },
  { bg:'rgba(20,184,166,0.09)', bl:'rgba(20,184,166,0.45)'  },
  { bg:'rgba(251,113,133,0.09)',bl:'rgba(251,113,133,0.45)' },
  { bg:'rgba(251,191,36,0.09)', bl:'rgba(251,191,36,0.45)'  },
];

// ── Utilities ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// AI : escape for single-quoted JS strings inside onclick attributes — backslash breaks esc() alone.
function escJs(s) {
  return String(s)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\n/g, '\\n')
    .replace(/\r/g, '\\r')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}
function humanize(key) {
  return String(key).replace(/[-_]/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2')
    .replace(/\b\w/g,c=>c.toUpperCase()).trim();
}
function isDateStr(s) { return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}/.test(s); }
function inferType(val) {
  if (val===null) return 'null';
  if (typeof val==='boolean') return 'boolean';
  if (typeof val==='number') return 'number';
  if (typeof val==='string') return isDateStr(val)?'date':'string';
  if (Array.isArray(val)) return 'array';
  return 'object';
}

// AI : latex / markdown string leaves — preview inside tree/table/detail (not a separate viewer tab).
const MARKUP_LATEX_KEYS = new Set(['latex','latex_body','latex_template','tex','source_tex']);
const MARKUP_MD_KEYS = new Set(['markdown','md','body_md','content_md','readme','documentation']);
let _katexReady = null;
let _tikzReady = null;

function looksLikeLatexSource(s) {
  const t = String(s).trim();
  if (!t) return false;
  if (/\\documentclass\b/.test(t) || /\\begin\{document\}/.test(t)) return true;
  if (/\\begin\{tikzpicture\}/.test(t) || /\\section\*?\b/.test(t) || /\\subsection\*?\b/.test(t)) return true;
  const cmds = t.match(/\\[a-zA-Z]+/g);
  return (cmds?.length ?? 0) >= 3 && (/\$[^$]+\$/.test(t) || /\\frac\b|\\mathbf\b|\\textit\b/.test(t));
}
function looksLikeMarkdownSource(s) {
  const t = String(s);
  return /^#{1,6}\s/m.test(t) || /\*\*[^*]+\*\*/.test(t) || /```/.test(t) || /\[[^\]]+\]\([^)]+\)/.test(t);
}
function detectMarkupKind(s, key='') {
  if (typeof s !== 'string' || !s.trim()) return null;
  const k = String(key).toLowerCase();
  if (MARKUP_LATEX_KEYS.has(k)) return 'latex';
  if (MARKUP_MD_KEYS.has(k)) return 'markdown';
  if (looksLikeLatexSource(s)) return 'latex';
  if (s.length > 80 && looksLikeMarkdownSource(s)) return 'markdown';
  return null;
}
function markupChipLabel(kind, s) {
  const n = String(s).length;
  const size = n >= 1000 ? `${(n/1000).toFixed(1)}k` : String(n);
  return size;
}
function latexToPreviewMarkdown(source) {
  let body = source;
  const doc = source.match(/\\begin\{document\}([\s\S]*?)\\end\{document\}/);
  if (doc?.[1] != null) body = doc[1];
  body = body.replace(/\\begin\{tikzpicture\}[\s\S]*?\\end\{tikzpicture\}/g, (block) => `\n\n\`\`\`tikz\n${block.trim()}\n\`\`\`\n\n`);
  body = body.replace(/\\begin\{figure\}[\s\S]*?\\end\{figure\}/g, (fig) => {
    const tikz = fig.match(/```tikz[\s\S]*?```/);
    return tikz ? `\n\n${tikz[0]}\n\n` : '\n\n*[figure]*\n\n';
  });
  body = body
    .replace(/\\section\*\{([^}]*)\}/g, '\n\n## $1\n\n')
    .replace(/\\section\{([^}]*)\}/g, '\n\n## $1\n\n')
    .replace(/\\subsection\*\{([^}]*)\}/g, '\n\n### $1\n\n')
    .replace(/\\subsection\{([^}]*)\}/g, '\n\n### $1\n\n')
    .replace(/\\subsubsection\*\{([^}]*)\}/g, '\n\n#### $1\n\n')
    .replace(/\\subsubsection\{([^}]*)\}/g, '\n\n#### $1\n\n')
    .replace(/\\textbf\{([^}]*)\}/g, '**$1**')
    .replace(/\\textit\{([^}]*)\}/g, '*$1*')
    .replace(/\\emph\{([^}]*)\}/g, '*$1*')
    .replace(/\\underline\{([^}]*)\}/g, '$1')
    .replace(/\\textmd\{([^}]*)\}/g, '$1')
    .replace(/\\textrm\{([^}]*)\}/g, '$1')
    .replace(/\\begin\{enumerate\}/g, '\n')
    .replace(/\\end\{enumerate\}/g, '\n')
    .replace(/\\begin\{itemize\}/g, '\n')
    .replace(/\\end\{itemize\}/g, '\n')
    .replace(/\\item\s+/g, '\n- ')
    .replace(/\\newline\b/g, '\n')
    .replace(/\\\\/g, '\n')
    .replace(/\\par\b/g, '\n\n')
    .replace(/~/g, ' ')
    .replace(/\\(?:vspace|hspace|label|ref|cite)\*?\{[^}]*\}/g, '')
    .replace(/\\(?:centering|raggedright|raggedleft|noindent|bigskip|medskip|smallskip)\b/g, '');
  return body.replace(/\n{3,}/g, '\n\n').trim();
}
function simpleMarkdownToHtml(md) {
  const parts = [];
  const lines = md.split('\n');
  let i = 0;
  let para = [];
  const flushPara = () => {
    if (!para.length) return;
    const text = para.join(' ').trim();
    if (text) parts.push(`<p>${inlineFormat(text)}</p>`);
    para = [];
  };
  const inlineFormat = (t) => {
    let s = esc(t);
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    return s;
  };
  while (i < lines.length) {
    const line = lines[i];
    const fence = line.match(/^```(\w+)?\s*$/);
    if (fence) {
      flushPara();
      const lang = fence[1] || '';
      const buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      const body = buf.join('\n');
      if (lang === 'tikz') {
        parts.push(`<div class="tikz-host" data-tikz="${encodeURIComponent(body)}"></div>`);
      } else {
        parts.push(`<pre class="tikz-fallback">${esc(body)}</pre>`);
      }
      continue;
    }
    if (/^####\s+/.test(line)) { flushPara(); parts.push(`<h4>${inlineFormat(line.replace(/^####\s+/, ''))}</h4>`); i++; continue; }
    if (/^###\s+/.test(line)) { flushPara(); parts.push(`<h3>${inlineFormat(line.replace(/^###\s+/, ''))}</h3>`); i++; continue; }
    if (/^##\s+/.test(line)) { flushPara(); parts.push(`<h2>${inlineFormat(line.replace(/^##\s+/, ''))}</h2>`); i++; continue; }
    if (/^-\s+/.test(line)) { flushPara(); parts.push(`<p>• ${inlineFormat(line.replace(/^-\s+/, ''))}</p>`); i++; continue; }
    if (!line.trim()) { flushPara(); i++; continue; }
    para.push(line.trim());
    i++;

async function mountMarkupPreview(container, source, kind) {
  container.className = 'markup-preview';

    container.innerHTML = simpleMarkdownToHtml(md);

    if (window.renderMathInElement) {
      window.renderMathInElement(container, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '$', right: '$', display: false },
          { left: '\\(', right: '\\)', display: false },
        ],
        throwOnError: false,
      });
    }
    const hosts = [...container.querySelectorAll('.tikz-host[data-tikz]')];
    if (hosts.length) {
      await ensureTikzJax();
      for (const host of hosts) {
        const encoded = host.getAttribute('data-tikz') || '';
        let src = '';

        host.removeAttribute('data-tikz');
        const script = document.createElement('script');
        script.type = 'text/tikz';
        script.textContent = /\\begin\{tikzpicture\}/.test(src)
          ? src
          : `\\begin{tikzpicture}\n${src}\n\\end{tikzpicture}`;
        host.appendChild(script);

// AI: parse JSON embedded in string fields (cells_json, table_a_json, …) — shared by tree + table views
function tryParseEmbeddedJson(s) {
  if (typeof s !== 'string') return null;
  const t = s.trim();
  if (!t || (t[0] !== '{' && t[0] !== '[')) return null;
  try {
    const parsed = JSON.parse(t);
    if (parsed !== null && typeof parsed === 'object') return parsed;
  } catch (_) {}
  return null;
}

function unwrapForDisplay(val) {
  if (typeof val === 'string') {
    const parsed = tryParseEmbeddedJson(val);
    if (parsed !== null) return parsed;
  }
  return val;
}

// AI: human-facing views (tree, table, structure) must never show serialized JSON as a leaf value
function assertNotRawEmbeddedJson(val, path) {
  if (typeof val !== 'string' || tryParseEmbeddedJson(val) === null) return;
  const where = path || '(root)';
  const msg = `[JSON Viewer] raw embedded JSON must not be shown as a field value at ${where}`;
  console.assert(false, msg);
  console.error(msg);
}

// AI: load-time check — every leaf must be displayable without a raw JSON string after unwrapping
function auditNoRawEmbeddedJsonLeaves(val, path = '') {
  const display = unwrapForDisplay(val);
  const type = inferType(display);
  if (type !== 'object' && type !== 'array') {
    assertNotRawEmbeddedJson(display, path);
    return;
  }
  if (Array.isArray(display)) {
    display.forEach((item, i) => auditNoRawEmbeddedJsonLeaves(item, path ? `${path}[${i}]` : `[${i}]`));
    return;
  }
  Object.entries(display).forEach(([k, v]) => auditNoRawEmbeddedJsonLeaves(v, path ? `${path}.${k}` : k));
}
function friendlyTypeName(jsType, format, hasEnum) {
  if (hasEnum) return 'Choice';
  if (format==='date-time'||format==='date') return 'Date';
  if (format==='email') return 'Email';
  if (format==='uri'||format==='url') return 'URL';
  if (Array.isArray(jsType)) return jsType.map(t=>friendlyTypeName(t)).join(' or ');
  return {string:'Text',number:'Number',integer:'Number',boolean:'Yes / No',
          array:'List',object:'Group',null:'Empty',date:'Date'}[jsType]||jsType||'Value';
}
function typeBadgeClass(jsType, format, hasEnum) {
  if (hasEnum) return 'bt-choice';
  if (format==='date-time'||format==='date') return 'bt-date';
  if (Array.isArray(jsType)) return 'bt-mixed';
  return {string:'bt-text',number:'bt-number',integer:'bt-number',
          boolean:'bt-bool',array:'bt-list',object:'bt-group',
          null:'bt-null',date:'bt-date'}[jsType]||'bt-group';
}
function formatVal(val,type) {
  if (type==='null') return 'empty';
  if (type==='boolean') return val?'Yes':'No';
  if (type==='date') {
    try { return new Date(val).toLocaleString('en-AU',{dateStyle:'medium',timeStyle:'short'}); }
    catch { return val; }
  }
  return String(val);
}
function valClass(type) {
  return {string:'v-str',number:'v-num',boolean:'v-bool',null:'v-null',date:'v-date'}[type]||'v-str';
}
// AI: smart number formatting — auto-detects monetary vs percentage vs plain by key name
function formatNum(val, key='') {
  if (typeof val !== 'number') return String(val);
  const k = key.toLowerCase();
  const isMoney = /usd|price|amount|revenue|raised|valuation|cost|fee|salary|total|subtotal|balance/.test(k);
  const isPct   = /pct|percent|rate|growth/.test(k);
  if (isMoney) {
    if (Math.abs(val)>=1e9) return '$'+(val/1e9).toFixed(1)+'B';
    if (Math.abs(val)>=1e6) return '$'+(val/1e6).toFixed(1)+'M';
    if (Math.abs(val)>=1e3) return '$'+val.toLocaleString();
    return '$'+val;
  }
  if (isPct) return val+'%';
  if (Math.abs(val)>=10000) return val.toLocaleString();
  return String(val);
}
function fmtDate(s) {
  try { return new Date(s).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}); }
  catch { return s; }
}

// ── Side panel zoom (pinch + ctrl/wheel + buttons) ───────────────────────────
const ZOOM_MIN = 0.5, ZOOM_MAX = 3, ZOOM_STEP = 0.1;
let _panelZoom = 1;

function applyPanelZoom() {
  const vp = document.getElementById('json-zoom-viewport');
  const lbl = document.getElementById('jp-zoom-label');
  if (vp) vp.style.transform = `scale(${_panelZoom})`;
  if (lbl) lbl.textContent = `${Math.round(_panelZoom * 100)}%`;
}

function setPanelZoom(next, anchorX, anchorY) {
  const scroll = document.getElementById('json-zoom-scroll');
  const prev = _panelZoom;
  _panelZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, next));
  if (!scroll) { applyPanelZoom(); return; }

  const rect = scroll.getBoundingClientRect();
  const ax = anchorX != null ? anchorX - rect.left : scroll.clientWidth / 2;
  const ay = anchorY != null ? anchorY - rect.top : scroll.clientHeight / 2;
  const ratio = _panelZoom / prev;
  const sl = scroll.scrollLeft;
  const st = scroll.scrollTop;

  applyPanelZoom();
  scroll.scrollLeft = (sl + ax) * ratio - ax;
  scroll.scrollTop = (st + ay) * ratio - ay;
}

function zoomStep(dir) {
  setPanelZoom(_panelZoom + dir * ZOOM_STEP);
}

function resetZoom() {
  _panelZoom = 1;
  applyPanelZoom();
  const scroll = document.getElementById('json-zoom-scroll');
  if (scroll) { scroll.scrollLeft = 0; scroll.scrollTop = 0; }
}

(function initPanelZoom() {
  const scroll = document.getElementById('json-zoom-scroll');
  if (!scroll) return;

  scroll.addEventListener('wheel', (e) => {
    if (!document.getElementById('json-panel').classList.contains('open')) return;
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? -ZOOM_STEP : ZOOM_STEP;
    setPanelZoom(_panelZoom + delta, e.clientX, e.clientY);
  }, { passive: false });

  let pinchStart = null;
  scroll.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStart = {
        dist: Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY,
        ),
        zoom: _panelZoom,
        midX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        midY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    }
  }, { passive: true });

  scroll.addEventListener('touchmove', (e) => {
    if (!pinchStart || e.touches.length !== 2) return;
    e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY,
    );
    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    setPanelZoom(pinchStart.zoom * (dist / pinchStart.dist), midX, midY);
  }, { passive: false });

  scroll.addEventListener('touchend', () => { pinchStart = null; }, { passive: true });
  applyPanelZoom();
})();

const ST = {
  string:  { label:'Text',     color:'#86efac' },
  date:    { label:'Date',     color:'#67e8f9' },
  number:  { label:'Number',   color:'#93c5fd' },

};

// Merge keys from all items in an array so every field is represented
function unionSample(arr) {
  const s = {};
  arr.forEach(item => {
    if (item && typeof item === 'object' && !Array.isArray(item))
      Object.entries(item).forEach(([k,v]) => { if (!(k in s)) s[k]=v; });
  });
  return s;
}

// AI: depth controls auto-expand — first 2 levels open by default
function renderDataStructure(val, container, depth, pathPrefix) {
  if (!val || typeof val !== 'object') return;
  if (Array.isArray(val)) {
    if (val.length && typeof val[0] === 'object') renderDataStructure(unionSample(val), container, depth, pathPrefix);
    return;
  }
  Object.entries(val).forEach(([k,v]) => {
    const p = pathPrefix ? `${pathPrefix}.${k}` : k;
    renderStField(k, v, container, depth, p);
  });
}

function renderStField(key, val, container, depth, path) {
  const label = humanize(key);
  const type  = inferType(val);

  if (type === 'object') {
    const node = document.createElement('div');
    const row  = mkStRow(depth, label, ST.object, true, path);
    const kids = mkStKids(depth);
    Object.entries(val).forEach(([k,v]) => renderStField(k, v, kids, depth+1, `${path}.${k}`));
    node.appendChild(row); node.appendChild(kids);
    wireStToggle(row, kids);
    container.appendChild(node); return;
  }

  if (type === 'array') {
    const hasObj = val.some(i => i && typeof i === 'object' && !Array.isArray(i));
    if (hasObj) {
      const node = document.createElement('div');
      const info = { label:`List  ·  ${val.length} item${val.length!==1?'s':''}`, color:'#fdba74' };
      const row  = mkStRow(depth, label, info, true, path);
      const kids = mkStKids(depth);
      const sample = unionSample(val);
      const eNode = document.createElement('div');
      const eRow  = mkStRow(depth+1, 'each item', ST.object, true, path);
      const eKids = mkStKids(depth+1);
      Object.entries(sample).forEach(([k,v]) => renderStField(k, v, eKids, depth+2, `${path}.${k}`));
      eNode.appendChild(eRow); eNode.appendChild(eKids);
      wireStToggle(eRow, eKids);
      kids.appendChild(eNode);
      node.appendChild(row); node.appendChild(kids);
      wireStToggle(row, kids);
      container.appendChild(node);
    } else {
      container.appendChild(mkStRow(depth, label, { label:`List of ${(ST[inferType(val[0])]||ST.string).label}`, color:'#fdba74' }, false, path));
    }
    return;
  }

  container.appendChild(mkStRow(depth, label, ST[type]||ST.string, false, path));
}

// Schema mode: show field names, types, required/optional
function renderSchemaStructure(schema, container) {
  if (schema.$ref) { const r=resolveRef(schema.$ref); if(r) schema={...r,...schema,$ref:undefined}; }
  if (schema.title) {
    const hdr = document.createElement('div');
    hdr.style.cssText='padding:10px 16px 6px;font-size:14px;font-weight:700;color:#e2e8f0;border-bottom:1px solid #242424;margin-bottom:4px';
    hdr.textContent = schema.title;
    container.appendChild(hdr);
  }
  if (schema.properties) {
    const reqSet = new Set(schema.required||[]);
    Object.entries(schema.properties).forEach(([k,sub]) => renderSchemaStField(k, sub, container, 0, reqSet.has(k), k));
  }
}

function renderSchemaStField(key, schema, container, depth, required, path) {
  if (schema.$ref) { const r=resolveRef(schema.$ref); if(r) schema={...r,...schema,$ref:undefined}; }
  const type=schema.type, format=schema.format||null, enumVals=schema.enum||null;
  const label=schema.title||humanize(key);
  const typeName=friendlyTypeName(type, format, enumVals);
  const typeColors={'Text':'#86efac','Number':'#93c5fd','Yes / No':'#c4b5fd','Date':'#67e8f9',
    'Email':'#67e8f9','URL':'#67e8f9','List':'#fdba74','Group':'#94a3b8','Choice':'#fcd34d'};
  const hasKids=(type==='object'||!!schema.properties)||(type==='array'&&!!schema.items);
  const typeInfo={ label:typeName, color:typeColors[typeName]||'#aaa' };

  const node=document.createElement('div');
  const row=mkStRow(depth, label, typeInfo, hasKids, path);
  // Add required/optional badge
  const badge=document.createElement('span');
  badge.className=required?'st-req':'st-opt';
  badge.textContent=required?'req':'opt';
  row.appendChild(badge);
  // Add description if present
  if (schema.description) {
    const d=document.createElement('span'); d.className='st-desc';
    d.textContent=schema.description; row.appendChild(d);
  }
  node.appendChild(row);

  if (hasKids) {
    const kids=mkStKids(depth);
    if ((type==='object'||schema.properties)&&schema.properties) {
      const reqSet=new Set(schema.required||[]);
      Object.entries(schema.properties).forEach(([k,sub])=>renderSchemaStField(k,sub,kids,depth+1,reqSet.has(k),`${path}.${k}`));
    } else if (type==='array'&&schema.items) {
      renderSchemaStField('(each item)', schema.items, kids, depth+1, false, `${path}[]`);
    }
    node.appendChild(kids);
    wireStToggle(row, kids);
  }
  container.appendChild(node);
}

function mkStRow(depth, label, typeInfo, hasKids, path) {
  const row=document.createElement('div');
  row.className=`st-row${hasKids?' st-parent':''}`;
  row.style.setProperty('--d', depth);
  if (path) row.setAttribute('data-path', path);
  const tog=document.createElement('span');
  tog.className=hasKids?'st-toggle':'st-spacer';
  tog.textContent=hasKids?'▶':'';
  const lbl=document.createElement('span'); lbl.className='st-label'; lbl.textContent=label;
  const badge=document.createElement('span'); badge.className='st-type';
  badge.textContent=typeInfo.label; badge.style.color=typeInfo.color;
  row.appendChild(tog); row.appendChild(lbl); row.appendChild(badge);
  return row;
}

// AI: depth <= 1 auto-expands, deeper levels start collapsed
function mkStKids(depth) {
  const k=document.createElement('div');
  k.className=`st-kids${depth >= 2 ? ' st-closed' : ''}`;
  k.style.setProperty('--d', depth);
  return k;
}

function wireStToggle(row, kids) {
  const t=row.querySelector('.st-toggle');
  if (t && !kids.classList.contains('st-closed')) t.textContent='▼';
  row.addEventListener('click', (e) => {
    e.stopPropagation(); // AI: prevent bubbling to ancestor rows (fixes deep list expansion)
    const closed=kids.classList.toggle('st-closed');
    const t=row.querySelector('.st-toggle');
    if (t) t.textContent=closed?'▶':'▼';
  });
}

// AI: open slide-over, switch to JSON mode, scroll/highlight matching line
function findJsonLine(path) {
  const root = document.getElementById('json-code');
  if (!root || !path) return null;
  let el = root.querySelector(`[data-path="${CSS.escape(path)}"]`);
  if (el) return el;
  const parts = path.split('.');
  while (parts.length > 1) {
    parts.pop();
    el = root.querySelector(`[data-path="${CSS.escape(parts.join('.'))}"]`);
    if (el) return el;
  }
  return null;
}

function scrollCodePanelTo(el) {
  const scroll = document.getElementById('json-zoom-scroll');
  if (!scroll || !el) return;
  const sr = scroll.getBoundingClientRect();
  const er = el.getBoundingClientRect();
  scroll.scrollTo({
    top: scroll.scrollTop + (er.top - sr.top) / _panelZoom - scroll.clientHeight / 2 + er.height / (2 * _panelZoom),
    left: scroll.scrollLeft + (er.left - sr.left) / _panelZoom - scroll.clientWidth / 2 + er.width / (2 * _panelZoom),
    behavior: 'smooth',
  });
}

function jumpToJson(path) {

    const target = findJsonLine(path);
    if (!target) { log('json:jump-miss', { path }); return; }
    expandJsonAncestors(target);
    scrollCodePanelTo(target);

// AI: jsonPath = raw dot-notation key path used by jumpToJson; path = humanized array for breadcrumb
function renderTreeNode(val, keyName, container, path, isArrayItem, jsonPath) {
  val = unwrapForDisplay(val);
  const type=inferType(val);
  const label=isArrayItem ? (getNodeTitle(val)||`Item ${keyName}`) : humanize(keyName);

  if (type==='object'||type==='array') {
    const isArr=type==='array';
    const entries=isArr?val:Object.entries(val);
    const count=isArr?val.length:entries.length;
    const icon=isArr?'▤':'▦';

    const node=document.createElement('div'); node.className='tree-node';

    const row=document.createElement('div'); row.className='tree-row t-parent';
    row.innerHTML=
      `<span class="t-toggle">▶</span>` +
      `<span class="t-icon" style="color:${isArr?'#c2410c':'#2563eb'}">${icon}</span>` +
      `<span class="t-key t-key-parent">${esc(label)}</span>` +
      `<span class="t-count">${count} ${isArr?'item':'field'}${count!==1?'s':''}</span>` +
      (jsonPath ? mkJumpLinks(jsonPath, true) : '');

    const kids=document.createElement('div'); kids.className='t-children t-closed';

    `<span class="t-key">${esc(label)}</span>` +
    `<span class="t-dot"></span>` +
    valHtml +

  row.addEventListener('mouseleave',clearCrumb);

    container.appendChild(hdr);

function buildConstraints(s) {
  const o=[];
  if (s.minLength!=null) o.push(`At least ${s.minLength} char${s.minLength!==1?'s':''}`);
  if (s.maxLength!=null) o.push(`Up to ${s.maxLength} chars`);

  if (s.maximum  !=null) o.push(`Max ${s.maximum}`);
  if (s.exclusiveMinimum!=null) o.push(`> ${s.exclusiveMinimum}`);
  if (s.exclusiveMaximum!=null) o.push(`< ${s.exclusiveMaximum}`);
  if (s.minItems !=null) o.push(`At least ${s.minItems} item${s.minItems!==1?'s':''}`);
  if (s.maxItems !=null) o.push(`Up to ${s.maxItems} items`);
  if (s.pattern) o.push(`Pattern: ${s.pattern}`);
  if (s.format==='email') o.push('Valid email');
  if (s.format==='uri'||s.format==='url') o.push('Valid URL');
  if (s.format==='date-time') o.push('Date & time');
  if (s.format==='date') o.push('Date (YYYY-MM-DD)');
  return o;
}
function renderDataVal(val,path,container,keyName) {

    const label=keyName!==null?humanize(String(keyName)):'Value';

    const lbls=document.createElement('div'); lbls.className='n-labels';

    const label=humanize(String(keyName)),card=mkCard(),head=mkHead(entries.length>0),chev=mkChev(entries.length>0);
    head.appendChild(chev);
    const lbls=document.createElement('div'); lbls.className='n-labels';
    lbls.innerHTML=`<div class="n-label">${esc(label)}</div><div class="n-desc">${entries.length} field${entries.length!==1?'s':''}</div>`;

  head.appendChild(lbls);

function mkCard() { const d=document.createElement('div'); d.className='node-card'; return d; }
function mkHead(c) { const d=document.createElement('div'); d.className=`node-head ${c?'clickable':'static'}`; return d; }
function mkChev(h) { const s=document.createElement('span'); s.className=`n-chev${h?'':' leaf'}`; s.textContent='▶'; return s; }
function wireNode(head,chev,childEl,path) {

// ── Excel / Table renderer ────────────────────────────────────────────────────

// AI: drill-down stack — each entry is { label, rows } for data tables
let excelStack = [];
// AI: which object-ref column keys have been expanded inline; Map key→colorIdx for stable colors
let expandedRefCols = new Set();
let groupColorMap   = new Map();
let _colorCounter   = 0;

function getGroupColor(key) {
  if (!groupColorMap.has(key)) groupColorMap.set(key, _colorCounter++ % GROUP_COLORS.length);
  return GROUP_COLORS[groupColorMap.get(key)];
}
function expandRefCol(key)  { log('col:expand-ref', { key }); expandedRefCols.add(key);    drawDataTable(); }
function collapseRefCol(key){ log('col:collapse-ref', { key }); expandedRefCols.delete(key); drawDataTable(); }

function assignFlattenedValue(cols, fullKey, v, depth, labelKey) {
  if (v === null || typeof v !== 'object') {
    cols[fullKey] = v;
    return;
  }
  if (Array.isArray(v)) {
    cols[fullKey] = { $ref: 'array', $val: v, $count: v.length, $label: humanize(labelKey) };
    return;
  }
  if (depth < 1) Object.assign(cols, flattenRow(v, depth + 1, fullKey));
  else cols[fullKey] = { $ref: 'object', $val: v, $label: humanize(labelKey) };
}

// AI: flatten one level of nested objects into dotted-key columns; arrays/deep objects become reference cells
function flattenRow(obj, depth=0, prefix='') {
  const cols={};
  if (!obj||typeof obj!=='object'||Array.isArray(obj)) return cols;
  for (const [k,v] of Object.entries(obj)) {
    const fullKey=prefix?`${prefix}.${k}`:k;
    if (v===null||typeof v!=='object') {
      if (typeof v === 'string') {
        const parsed = tryParseEmbeddedJson(v);
        if (parsed !== null) { assignFlattenedValue(cols, fullKey, parsed, depth, k); continue; }
      }
      cols[fullKey]=v;
    } else if (Array.isArray(v)) {
      cols[fullKey]={ $ref:'array',  $val:v, $count:v.length, $label:humanize(k) };
    } else if (depth<1) {
      Object.assign(cols, flattenRow(v, depth+1, fullKey));
    } else {
      cols[fullKey]={ $ref:'object', $val:v, $label:humanize(k) };
    }
  }
  return cols;
}

function colLabel(key) {
  const parts=key.split('.');
  if (parts.length===1) return { group:null, name:humanize(parts[0]), path:key };
  return { group:parts.slice(0,-1).join('.'), name:parts[parts.length-1], path:key };
}

function sampleValueForCol(rows, col) {
  const flatKey = col.groupKey ? joinJsonPath(col.key, col.subKey) : col.key;
  for (const row of rows) {
    if (!row || typeof row !== 'object') continue;
    const flat = flattenRow(row);
    const v = flat[flatKey];
    if (v !== null && v !== undefined && !(v && typeof v === 'object' && v.$ref)) return v;
  }
  return null;
}

function colHeaderLabel(col) {
  if (col.key.includes('.')) return col.key;
  return col.group ? col.name : (col.name || humanize(col.key));
}

// AI: list[text] and other primitive arrays drill into string/number rows — tabulate as single-column objects
function isPrimitiveTableRows(rows) {
  if (!Array.isArray(rows) || !rows.length) return false;
  return !rows.some(r => r !== null && typeof r === 'object');
}

function wrapPrimitiveTableRows(rows, label) {
  const colName = label || 'Value';
  return {
    rows: rows.map(v => ({ value: v })),
    cols: [{ type: 'leaf', key: 'value', name: colName, group: null, groupKey: null }],
  };
}

// AI: table view must never show a row count with zero rendered rows — fail if row shape is unhandled
function describeTableRowShape(rows) {
  return [...new Set(rows.map(r => {
    if (r === null) return 'null';
    if (Array.isArray(r)) return 'array';
    return typeof r;
  }))].join(', ');
}

function assertTableTabulationHandled(label, rawRows, tableRows, cols, renderedRowCount) {
  if (!rawRows?.length) return true;
  const where = label || '(table)';
  if (!cols.length) {
    const msg = `[JSON Viewer] tabulation produced no columns for ${rawRows.length} row(s) at ${where} (${describeTableRowShape(rawRows)}) — add a table handler`;
    console.assert(false, msg);
    console.error(msg);
    return false;
  }
  if (isPrimitiveTableRows(rawRows)) return true;
  const unhandled = rawRows.filter(r => r === null || typeof r !== 'object');
  if (unhandled.length) {
    const msg = `[JSON Viewer] ${unhandled.length} primitive row(s) at ${where} were not wrapped — extend isPrimitiveTableRows/wrapPrimitiveTableRows`;
    console.assert(false, msg);
    console.error(msg);
    return false;
  }
  if (renderedRowCount >= 0 && renderedRowCount !== tableRows.length) {
    const msg = `[JSON Viewer] tabulation dropped rows at ${where}: ${tableRows.length} expected, ${renderedRowCount} rendered`;
    console.assert(false, msg);
    console.error(msg);
    return false;
  }
  return true;
}

// AI: builds column definitions respecting expandedRefCols — expands object refs inline
function buildTableColDefs(rows) {
  // Collect base flat keys and their ref types
  const baseMap = new Map(); // key -> { isRef, refType, refLabel }
  rows.forEach(row => {
    if (!row||typeof row!=='object') return;
    const flat = flattenRow(row);
    Object.entries(flat).forEach(([k, v]) => {
      if (baseMap.has(k)) return;
      if (v&&typeof v==='object'&&v.$ref) baseMap.set(k,{isRef:true,refType:v.$ref,refLabel:v.$label});
      else baseMap.set(k,{isRef:false});
    });
  });

  const cols = [];
  for (const [key, info] of baseMap) {
    const lbl = colLabel(key);

    if (info.isRef && info.refType==='object' && expandedRefCols.has(key)) {
      // Expanded: add sub-columns for each primitive/ref inside the nested object
      const subMap = new Map();
      rows.forEach(row => {
        if (!row||typeof row!=='object') return;
        const flat = flattenRow(row);
        const cell = flat[key];
        if (cell&&cell.$ref==='object'&&cell.$val) {
          const subFlat = flattenRow(cell.$val, 0, '');
          Object.entries(subFlat).forEach(([sk, sv]) => {
            if (subMap.has(sk)) return;
            const isSR = sv&&typeof sv==='object'&&sv.$ref;
            subMap.set(sk, { isRef:!!isSR, refType:isSR?sv.$ref:null, refLabel:isSR?sv.$label:null });
          });
        }
      });
      const color = getGroupColor(key);
      const subArr = [...subMap.entries()];
      subArr.forEach(([sk, sinfo], si) => {
        const subLbl = colLabel(sk);
        cols.push({
          type: sinfo.isRef ? `ref-${sinfo.refType}` : 'sub-leaf',
          key, subKey: sk,          // key = parent ref key, subKey = field inside it
          name: subLbl.name,
          groupKey: key, groupName: lbl.name, color,
          isFirst: si===0, isLast: si===subArr.length-1,
          refLabel: sinfo.refLabel, refType: sinfo.refType,
        });
      });
    } else if (info.isRef && info.refType==='object') {
      cols.push({ type:'ref-obj', key, name:lbl.name, group:lbl.group, refLabel:info.refLabel, groupKey:null });
    } else if (info.isRef && info.refType==='array') {
      cols.push({ type:'ref-arr', key, name:lbl.name, group:lbl.group, refLabel:info.refLabel, groupKey:null });
    } else {
      cols.push({ type:'leaf', key, name:lbl.name, group:lbl.group, groupKey:null });
    }
  }
  return cols;
}

function tableRowsFromValue(v) {
  if (Array.isArray(v) && v.length > 0 && v.some(i => i && typeof i === 'object' && !Array.isArray(i))) return v;
  if (typeof v === 'string') {
    const parsed = tryParseEmbeddedJson(v);
    if (Array.isArray(parsed) && parsed.length > 0 && parsed.some(i => i && typeof i === 'object' && !Array.isArray(i))) return parsed;
  }
  return null;
}

// AI: detect best array to use as primary table; prefer largest array of objects (incl. JSON string fields)
function detectPrimaryTable(val) {
  if (Array.isArray(val)) return { label:'Items', rows:val, jsonPath:'', isArray:true };
  if (typeof val==='object'&&val) {
    let best=null;
    for (const [k,v] of Object.entries(val)) {
      const rows = tableRowsFromValue(v);
      if (rows && (!best || rows.length > best.rows.length)) best={ label:humanize(k), rows, jsonPath:k, isArray:true };
    }
    if (best) return best;
    return { label:'Record', rows:[val], jsonPath:'', isArray:false };
  }
  return null;
}

function renderTable(val, mode) {
  log('table:render', { mode, isArray: Array.isArray(val), keys: val&&typeof val==='object'?Object.keys(val):[] });
  excelStack=[];
  expandedRefCols.clear();
  groupColorMap.clear();
  _colorCounter=0;
  const root=document.getElementById('rp-content');
  root.innerHTML='';

  if (mode==='schema') {
    renderSchemaTable(val);
    return;
  }
  const primary=detectPrimaryTable(val);
  if (!primary) { root.innerHTML='<div style="color:var(--muted);padding:20px">Nothing to tabulate</div>'; return; }
  excelStack.push(primary);
  drawDataTable();
}

function drawDataTable() {
  const root=document.getElementById('rp-content');
  root.innerHTML='';
  const { label, rows, jsonPath='', isArray=true }=excelStack[excelStack.length-1];

  // Navigation bar
  const nav=document.createElement('div'); nav.className='excel-nav';
  if (excelStack.length>1) {
    const back=document.createElement('button'); back.className='ex-back'; back.textContent='← Back';
    back.onclick=()=>{ excelStack.pop(); drawDataTable(); };
    nav.appendChild(back);
  }
  const bc=document.createElement('div'); bc.className='ex-bc';
  excelStack.forEach((t,i)=>{
    if (i>0) { const sep=document.createElement('span'); sep.className='ebc-sep'; sep.textContent='›'; bc.appendChild(sep); }
    const span=document.createElement('span');
    span.textContent=t.label;
    if (i<excelStack.length-1) {
      span.className='ebc-link';
      const ti=i; span.onclick=()=>{ excelStack.splice(ti+1); drawDataTable(); };
    } else span.className='ebc-active';
    bc.appendChild(span);
  });
  nav.appendChild(bc);
  const cnt=document.createElement('span'); cnt.className='ex-count';
  cnt.textContent=`${rows.length} row${rows.length!==1?'s':''}`;
  nav.appendChild(cnt);
  root.appendChild(nav);
  updateCrumb(excelStack.map(t=>t.label));

  if (!rows||rows.length===0) {
    root.innerHTML+='<div style="color:var(--muted);padding:20px;font-size:13px">No rows.</div>'; return;
  }

  const primitiveTable = isPrimitiveTableRows(rows);
  const wrappedPrimitive = primitiveTable ? wrapPrimitiveTableRows(rows, label) : null;
  const tableRows = wrappedPrimitive ? wrappedPrimitive.rows : rows;
  const cols = wrappedPrimitive ? wrappedPrimitive.cols : buildTableColDefs(rows);
  if (!assertTableTabulationHandled(label, rows, tableRows, cols, -1)) {
    root.innerHTML += '<div style="color:#f87171;padding:20px;font-size:13px">Table tabulation failed — see console.</div>';
    return;
  }
  const hasExpandedGroups = cols.some(c=>c.groupKey);

  const wrap=document.createElement('div'); wrap.className='excel-wrap';
  const table=document.createElement('table'); table.className='excel-table';
  const thead=document.createElement('thead');

  // ── Row 1: group headers + direct/ref columns ──────────────────────────────
  const tr1=document.createElement('tr');

  // # cell (rowspan=2 if there's a sub-row)
  const th0=document.createElement('th');
  th0.className='th-num';
  if (hasExpandedGroups) th0.rowSpan=2;
  th0.innerHTML='<div class="th-inner"><span class="th-name" style="color:var(--muted)">#</span></div>';
  tr1.appendChild(th0);

  // Track group spans for the group header cells
  let i=0;
  while (i<cols.length) {
    const col=cols[i];
    if (col.groupKey) {
      // Collect all cols in this group
      const groupKey=col.groupKey;
      const groupCols=[];
      while (i<cols.length && cols[i].groupKey===groupKey) { groupCols.push(cols[i]); i++; }
      const color=groupCols[0].color;

      // Group header cell spans all sub-columns
      const thg=document.createElement('th');
      thg.colSpan=groupCols.length;
      thg.style.cssText=`background:${color.dark};border-bottom:2px solid ${color.bar};text-align:center`;
      const inner=document.createElement('div'); inner.className='th-inner';
      inner.style.cssText='flex-direction:row;align-items:center;justify-content:center;gap:4px;padding:5px 8px';
      inner.innerHTML=`<span class="th-name" style="color:${color.bar}">${esc(groupCols[0].groupName)}</span>`;
      const colBtn=document.createElement('button');
      colBtn.className='col-btn collapse'; colBtn.textContent='⊖';
      colBtn.title=`Collapse ${groupCols[0].groupName} columns`;
      const gk=groupKey; colBtn.onclick=()=>collapseRefCol(gk);
      inner.appendChild(colBtn);
      thg.appendChild(inner);
      tr1.appendChild(thg);
    } else {
      // Direct or ref column — rowspan=2 if there's a sub-row
      const th=document.createElement('th');
      if (hasExpandedGroups) th.rowSpan=2;
      const lbl=col.group && !col.key.includes('.')?`<span class="th-group">${esc(col.group)}</span>`:'';
      const inner=document.createElement('div'); inner.className='th-inner';
      const headerName=colHeaderLabel(col);
      const sampleVal=col.type==='leaf'||col.type==='sub-leaf'?sampleValueForCol(tableRows,col):null;
      const typeHint=sampleVal!==null?friendlyTypeName(inferType(sampleVal)):null;

      if (col.type==='ref-obj') {
        inner.innerHTML=`${lbl}<span class="th-name">${esc(headerName)}</span>`;
        const expBtn=document.createElement('button');
        expBtn.className='col-btn expand'; expBtn.textContent='⊕';
        expBtn.title=`Expand ${col.name} as columns`;
        const ck=col.key; expBtn.onclick=()=>expandRefCol(ck);
        inner.appendChild(expBtn);
        appendThStructureLink(inner, col.key);
      } else if (col.type==='ref-arr') {
        inner.innerHTML=`${lbl}<span class="th-name">${esc(headerName)}</span><span style="color:#60a5fa;margin-left:4px;font-size:10px">▤ list</span>`;
        appendThStructureLink(inner, col.key);
      } else {
        const nameCls=col.key.includes('.')?'th-name th-path':'th-name';
        inner.innerHTML=`${lbl}<span class="${nameCls}">${esc(headerName)}</span>${typeHint?`<span class="th-type">${esc(typeHint)}</span>`:''}`;
        appendThStructureLink(inner, col.groupKey?joinJsonPath(col.key,col.subKey):col.key);
      }
      th.appendChild(inner);
      th.title=col.key;
      tr1.appendChild(th);
      i++;
    }
  }
  thead.appendChild(tr1);

  // ── Row 2: sub-column headers (only if any group is expanded) ─────────────
  if (hasExpandedGroups) {
    const tr2=document.createElement('tr');
    cols.filter(c=>c.groupKey).forEach(col=>{
      const th=document.createElement('th');
      th.className='th-sub';
      th.style.cssText=`background:${col.color.dark};border-top:2px solid ${col.color.bar}`;
      const inner=document.createElement('div'); inner.className='th-inner';
      const subPath=joinJsonPath(col.key,col.subKey);
      const subSample=sampleValueForCol(tableRows,col);
      const subType=subSample!==null?friendlyTypeName(inferType(subSample)):null;
      inner.innerHTML=`<span class="th-name th-path" style="font-weight:500;color:#d0e8ff">${esc(subPath)}</span>${subType?`<span class="th-type">${esc(subType)}</span>`:''}`;
      appendThStructureLink(inner, subPath);
      th.appendChild(inner);
      th.title=subPath;
      tr2.appendChild(th);
    });
    thead.appendChild(tr2);
  }

  table.appendChild(thead);

  // ── Body ──────────────────────────────────────────────────────────────────
  const tbody=document.createElement('tbody');
  tableRows.forEach((row,rowIdx)=>{
    if (row===null||typeof row!=='object') return;
    const tr=document.createElement('tr');
    const td0=document.createElement('td');
    td0.className='td-num-idx';
    td0.textContent=rowIdx+1; tr.appendChild(td0);

    const flat=flattenRow(row);
    const rowPath=rowJsonPath({ jsonPath, isArray }, rowIdx);
    cols.forEach(col=>{
      const td=document.createElement('td');
      const colPath=col.groupKey ? joinJsonPath(col.key, col.subKey) : col.key;
      const cellJsonPath=joinJsonPath(rowPath, colPath);

      if (col.groupKey) {
        // Sub-column of an expanded group — get value from nested object
        const refCell=flat[col.key];
        const subFlat=(refCell&&refCell.$ref==='object'&&refCell.$val)
          ? flattenRow(refCell.$val, 0, '') : {};
        const val=subFlat[col.subKey];

        // Color the cell with the group tint
        td.style.cssText=`background:${col.color.light}`;
        if (col.isFirst)  td.style.borderLeft=`2px solid ${col.color.border}`;
        if (col.isLast)   td.style.borderRight=`2px solid ${col.color.border}`;

        // Handle sub-ref cells (nested array/object inside expanded group)
        if (val&&typeof val==='object'&&val.$ref==='array') {
          const btn=document.createElement('button'); btn.className='ref-arr';
          btn.style.fontSize='10.5px';
          btn.innerHTML=`📄 ${esc(val.$count)} ${esc(val.$label)} →`;
          btn.onclick=()=>{
            log('table:drill-in', { label:val.$label, depth:excelStack.length+1, count:val.$count });
            excelStack.push({ label:val.$label, rows:val.$val, jsonPath:cellJsonPath, isArray:true });
            drawDataTable();
          };
          td.appendChild(btn);
          appendCellJumps(td, cellJsonPath);
        } else if (val&&typeof val==='object'&&val.$ref==='object') {
          const btn=document.createElement('button'); btn.className='ref-obj';
          btn.style.fontSize='10.5px';
          btn.innerHTML=`🔗 ${esc(val.$label)} ↗`;
          btn.onclick=()=>openDetailPanel(val.$label,val.$val);
          td.appendChild(btn);
          appendCellJumps(td, cellJsonPath);
        } else {
          fillPrimCell(td, val, col.subKey, cellJsonPath);
        }
      } else {
        fillCell(td, flat[col.key], col.key, col.name, cellJsonPath, rowPath);
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  assertTableTabulationHandled(label, rows, tableRows, cols, tbody.children.length);
  table.appendChild(tbody);
  wrap.appendChild(table);
  root.appendChild(wrap);
}

// Fill a primitive cell (shared by normal and sub-column cells)
function fillPrimCell(td, val, key, jsonPath) {
  const path = jsonPath || key;
  assertNotRawEmbeddedJson(val, path);
  if (val===null||val===undefined) { td.className='td-null'; td.textContent='—'; appendCellJumps(td, path); return; }
  const type=inferType(val);
  if (type==='boolean') { td.innerHTML=val?`<span class="td-bool-y">✓ Yes</span>`:`<span class="td-bool-n">✗ No</span>`; appendCellJumps(td, path); return; }
  if (type==='date')    { td.className='td-date'; td.textContent=fmtDate(val); appendCellJumps(td, path); return; }
  if (type==='number')  { td.className='td-num';  td.textContent=formatNum(val,key); appendCellJumps(td, path); return; }
  if (typeof val === 'string') {
    const kind = detectMarkupKind(val, key);
    if (kind) {
      td.appendChild(mkMarkupChip(val, kind, () => openMarkupDetail(humanize(key), val, kind)));
      appendCellJumps(td, path);
      return;
    }
  }
  const s=String(val); td.textContent=s; td.title=s;
  if (s.length>30) td.style.maxWidth='180px';
  appendCellJumps(td, path);
}

function fillCell(td, val, key, label, cellJsonPath, rowPath) {
  if (val===null||val===undefined) { td.className='td-null'; td.textContent='—'; return; }

  // Array ref → drill into sub-table
  if (val&&typeof val==='object'&&val.$ref==='array') {
    const btn=document.createElement('button'); btn.className='ref-arr';
    btn.innerHTML=`📄 ${esc(val.$count)} ${esc(val.$label)} →`;
    btn.title=`Open ${val.$label} as table (${val.$count} items)`;
    const drillPath=cellJsonPath || joinJsonPath(rowPath, key);
    btn.onclick=()=>{
      log('table:drill-in', { label:val.$label, depth:excelStack.length+1, count:val.$count });
      excelStack.push({ label:val.$label, rows:val.$val, jsonPath:drillPath, isArray:true });
      drawDataTable();
    };
    td.appendChild(btn);
    appendCellJumps(td, drillPath);
    return;
  }
  // Object ref → slide-over details
  if (val&&typeof val==='object'&&val.$ref==='object') {
    const expBtn=document.createElement('button'); expBtn.className='ref-obj';
    expBtn.style.marginRight='4px';
    expBtn.innerHTML=`🔗 ${esc(val.$label)} ↗`;
    expBtn.title=`View ${val.$label} details`;
    expBtn.onclick=()=>openDetailPanel(val.$label,val.$val);
    td.appendChild(expBtn);
    appendCellJumps(td, cellJsonPath || joinJsonPath(rowPath, key));
    return;
  }

  fillPrimCell(td, val, key, cellJsonPath || joinJsonPath(rowPath, key));
}

// AI: extract all schema fields recursively into a flat reference table
function renderSchemaTable(schema) {
  const root=document.getElementById('rp-content');
  root.innerHTML='';

  const fields=[];
  extractSchemaFields(schema, fields, '', 0);

  const nav=document.createElement('div'); nav.className='excel-nav';
  const bc=document.createElement('div'); bc.className='ex-bc';
  const title=schema.title||'Schema';
  bc.innerHTML=`<span class="ebc-active">${esc(title)}</span>`;
  nav.appendChild(bc);
  const count=document.createElement('span'); count.className='ex-count';
  count.textContent=`${fields.length} field${fields.length!==1?'s':''}`;
  nav.appendChild(count);
  root.appendChild(nav);
  updateCrumb([title, 'Field Reference']);

  const wrap=document.createElement('div'); wrap.className='excel-wrap';
  const table=document.createElement('table'); table.className='excel-table schema-table';
  table.innerHTML=`<thead><tr>
    <th><div class="th-inner"><span class="th-name">#</span></div></th>
    <th><div class="th-inner"><span class="th-name">Field</span></div></th>
    <th><div class="th-inner"><span class="th-name">Path</span></div></th>
    <th><div class="th-inner"><span class="th-name">Type</span></div></th>
    <th><div class="th-inner"><span class="th-name">Required</span></div></th>
    <th><div class="th-inner"><span class="th-name">Description</span></div></th>
    <th><div class="th-inner"><span class="th-name">Rules &amp; Options</span></div></th>
  </tr></thead>`;
  const tbody=document.createElement('tbody');
  fields.forEach((f,i)=>{
    const tr=document.createElement('tr');
    const depth=f.path.split('.').length-1;
    tr.innerHTML=`
      <td class="td-num-idx">${i+1}</td>
      <td style="padding-left:${8+depth*12}px;font-weight:${depth===0?'600':'400'}">${esc(f.label)}</td>
      <td class="td-path">${esc(f.path)}</td>
      <td class="td-type"><span class="badge ${typeBadgeClass(f.jsType,f.format,f.enum)}" style="font-size:10px">${esc(f.typeName)}</span></td>
      <td class="${f.required?'td-required':'td-optional'}">${f.required?'Required':'Optional'}</td>
      <td style="color:#555;font-size:12px;max-width:220px">${esc(f.description)}</td>
      <td>${f.chips}</td>`;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  root.appendChild(wrap);
}

function extractSchemaFields(schema, out, prefix, depth) {
  if (schema.$ref) { const r=resolveRef(schema.$ref); if(r) schema={...r,...schema,$ref:undefined}; }
  if (!schema.properties) return;
  const reqSet=new Set(schema.required||[]);
  Object.entries(schema.properties).forEach(([k,sub])=>{
    if (sub.$ref) { const r=resolveRef(sub.$ref); if(r) sub={...r,...sub,$ref:undefined}; }
    const path=prefix?`${prefix}.${k}`:k;
    const cons=buildConstraints(sub);
    const chips=[
      ...cons.map(c=>`<span class="chip-constraint">${esc(c)}</span>`),
      ...(sub.enum||[]).map(v=>`<span class="chip-enum">${esc(String(v))}</span>`)
    ].join('');
    out.push({
      path, label:sub.title||humanize(k), depth,
      jsType:sub.type, format:sub.format||null, enum:sub.enum||null,
      typeName:friendlyTypeName(sub.type,sub.format,sub.enum),
      required:reqSet.has(k), description:sub.description||'', chips
    });
    if (sub.properties||(sub.type==='object'&&sub.properties)) extractSchemaFields(sub,out,path,depth+1);
    if (sub.type==='array'&&sub.items&&sub.items.properties) extractSchemaFields(sub.items,out,`${path}[]`,depth+1);
  });
}

// ── Detail slide-over ─────────────────────────────────────────────────────────
function clearDetailPanelChrome() {
  const panel = document.querySelector('.detail-panel');
  const overlay = document.getElementById('detail-overlay');
  if (panel) panel.classList.remove('dp-wide', 'dp-markup');
  if (overlay) overlay.classList.remove('markup-open');
}
function openDetailPanel(title, obj) {
  if (lockedViewMode() === 'table') {
    const rows = Array.isArray(obj) ? obj : [obj];
    excelStack.push({ label: title, rows, isArray: Array.isArray(obj) });
    drawDataTable();
    return;
  }
  clearDetailPanelChrome();
  const panel = document.querySelector('.detail-panel');
  document.getElementById('dp-title').textContent=title;
  const body=document.getElementById('dp-body'); body.innerHTML='';

  // AI : bare markup string (or single-field latex pack opened as string) — full formatted preview.
  if (typeof obj === 'string') {
    const kind = detectMarkupKind(obj, title) || 'markdown';
    if (panel) panel.classList.add('dp-wide', 'dp-markup');
    document.getElementById('detail-overlay').classList.add('markup-open');
    const wrap = document.createElement('div');
    body.appendChild(wrap);
    mountMarkupPreview(wrap, obj, kind);
    document.getElementById('detail-overlay').style.display='flex';
    return;
  }

  function addRow(key, val, indent=0) {
    val = unwrapForDisplay(val);
    const type=inferType(val);
    const row=document.createElement('div'); row.className='dp-row';
    row.style.paddingLeft=(8+indent*12)+'px';
    const keyEl=document.createElement('span'); keyEl.className='dp-key'; keyEl.textContent=humanize(key);
    row.appendChild(keyEl);

    if (type==='object'||type==='array') {
      const btn=document.createElement('button');
      btn.className=`${type==='array'?'ref-arr':'ref-obj'} dp-val-ref`;
      btn.style.fontSize='11px';
      if (type==='array') {
        btn.innerHTML=`📄 ${val.length} items →`;
        btn.onclick=()=>{ log('table:drill-in', { label:humanize(key), depth:excelStack.length+1, count:val.length }); excelStack.push({label:humanize(key),rows:val}); drawDataTable(); closeDetail(); };
      } else {
        btn.innerHTML=`🔗 ${esc(humanize(key))} ↗`;
        btn.onclick=()=>openDetailPanel(humanize(key),val);
      }
      row.appendChild(btn);
    } else {
      assertNotRawEmbeddedJson(val, key);
      const markupKind = typeof val === 'string' ? detectMarkupKind(val, key) : null;
      if (markupKind) {
        row.appendChild(mkMarkupChip(val, markupKind, () => openMarkupDetail(humanize(key), val, markupKind)));
      } else {
        const valEl=document.createElement('span');
        if (val===null) { valEl.className='dp-val-null'; valEl.textContent='—'; }
        else if (type==='boolean') { valEl.className=val?'dp-val-bool-t':'dp-val-bool-f'; valEl.textContent=val?'Yes':'No'; }
        else if (type==='date')  { valEl.className='dp-val-date'; valEl.textContent=fmtDate(val); }
        else if (type==='number'){ valEl.className='dp-val-num'; valEl.textContent=formatNum(val,key); }
        else { valEl.className='dp-val'; valEl.textContent=String(val); }
        row.appendChild(valEl);
      }
    }
    body.appendChild(row);
  }

  Object.entries(obj).forEach(([k,v])=>addRow(k,v));
  document.getElementById('detail-overlay').style.display='flex';
}
function closeDetail(e) {
  if (!e||e.target===document.getElementById('detail-overlay')) {
    clearDetailPanelChrome();
    document.getElementById('detail-overlay').style.display='none';
  }
}

function snapshotFileBase() {
